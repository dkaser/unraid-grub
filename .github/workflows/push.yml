name: Build Image
on:
  push:
    branches:
      - main
  pull_request:

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v6
      - name: Build
        run: |
          sudo apt install -y grub-common grub-pc
          cd src
          ./build.sh
          ls
      - name: Upload
        uses: actions/upload-artifact@v7
        with:
          name: BOOTX64.EFI
          path: |
            src/BOOTX64.EFI